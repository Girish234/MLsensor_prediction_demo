<!DOCTYPE html>
<html>
<head>
    <title>Predictive Maintenance</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; }
        .card {
            width: 400px;
            margin: auto;
            margin-top: 60px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        input, select {
            width: 100%;
            padding: 7px;
            margin: 6px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        h3 { text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h3>Predictive Maintenance</h3>
    <form method="post">
        <input name="air" placeholder="Air Temperature (K)" required>
        <input name="process" placeholder="Process Temperature (K)" required>
        <input name="rpm" placeholder="RPM" required>
        <input name="torque" placeholder="Torque (Nm)" required>
        <input name="wear" placeholder="Tool Wear (min)" required>

        <select name="type">
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="H">H</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h3>{{ prediction }}</h3>
    {% endif %}
</div>

</body>
</html>
